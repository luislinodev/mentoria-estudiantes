{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Completar perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card card-plataforma">
      <div class="card-body p-4 p-lg-5">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-3 icon-tile">
            <i class="bi bi-person-badge fs-4" aria-hidden="true"></i>
          </div>
          <div>
            <h1 class="h3 mb-0">Completa tu perfil</h1>
          </div>
        </div>
        <p class="text-secondary">Elige tu rol y tus datos académicos. Puedes ser mentor, aprendiz o ambos.</p>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary">Guardar perfil</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
