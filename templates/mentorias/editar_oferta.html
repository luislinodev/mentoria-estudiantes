{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Mi oferta de mentoría{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="{% url 'cuentas:panel' %}">Panel</a></li>
    <li class="breadcrumb-item active" aria-current="page">Oferta de mentoría</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card card-plataforma">
      <div class="card-body p-4 p-lg-5">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-3 icon-tile">
            <i class="bi bi-briefcase fs-4" aria-hidden="true"></i>
          </div>
          <h1 class="h3 mb-0">Oferta de mentoría</h1>
        </div>
        <p class="text-secondary">Define en qué puedes ayudar y cuándo sueles estar disponible.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary">Guardar oferta</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
